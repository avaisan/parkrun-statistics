name: Deploy API

on:
  workflow_run:
    workflows: ["Deploy Infrastructure"]
    types:
      - completed
    branches: [main]
  push:
    branches: [ main ]
    paths:
      - 'api/**'
      - '.github/workflows/deploy-api.yml'
      - '!**.md'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy (dev/prod)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

permissions:
  id-token: write
  contents: read

# One run per environment at a time; a newer run waits instead of overlapping
concurrency:
  group: deploy-api-${{ github.event.inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  # A push that also changes the infrastructure must not deploy in parallel with
  # Deploy Infrastructure: both would update the same Lambda/stack at once (409 conflict,
  # stack rollback). Such pushes are skipped here; this workflow then runs via
  # workflow_run after Deploy Infrastructure has succeeded.
  check-infra-change:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            infra:
              - 'cdk/**'
              - '.github/workflows/deploy-infra.yml'

  deploy-api:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}
    needs: check-infra-change
    # !cancelled() lets this job run when check-infra-change was skipped (non-push events)
    if: >-
      ${{ !cancelled() &&
      needs.check-infra-change.result != 'failure' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') &&
      (github.event_name != 'push' || needs.check-infra-change.outputs.infra != 'true') }}
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-central-1
          
      - name: Install Dependencies
        run: npm ci
          
      - name: Run linter
        run: npm run lint -w api
          
      - name: Run Tests
        run: npm test -w api
          
      - name: Build API
        env:
          TARGET_ENV: ${{ github.event.inputs.environment || 'dev' }}
        run: npm run build -w api
          
      - name: Package Lambda
        run: |
          cd api/dist
          npm install --omit=dev --no-package-lock
          zip -r ../../function.zip .
          
      - name: Update Lambda Function
        env:
          TARGET_ENV: ${{ github.event.inputs.environment || 'dev' }}
        run: |
          aws lambda update-function-code \
            --function-name "parkrun-api-${TARGET_ENV}" \
            --zip-file fileb://function.zip