name: Deploy Infrastructure

on:
  push:
    branches: [ main ]
    paths:
      - 'cdk/**'
      - '.github/workflows/deploy-infra.yml'
      - '!**.md'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy (dev/prod)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

permissions:
  id-token: write
  contents: read

jobs:
  deploy-infrastructure:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-central-1
          
      - name: Install CDK Dependencies
        run: npm ci
          
      - name: Deploy Infrastructure
        id: deploy
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          HOSTED_ZONE_ID: ${{ secrets.HOSTED_ZONE_ID }}
          DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
          TARGET_ENV: ${{ github.event.inputs.environment || 'dev' }}
        run: |
          cd cdk
          npm run deploy -- --require-approval never --outputs-file outputs.json

          # Deploy API / Deploy Frontend read these outputs from CloudFormation themselves,
          # so nothing is copied into repository secrets (no personal access token needed).
          echo "Stack outputs:"
          jq ".[\"parkrun-stack-${TARGET_ENV}\"]" outputs.json
