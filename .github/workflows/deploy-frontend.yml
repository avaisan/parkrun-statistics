name: Deploy Frontend

on:
  workflow_run:
    workflows: ["Deploy Infrastructure"]
    types:
      - completed
    branches: [main]
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
      - '!**.md'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy (dev/prod)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

permissions:
  id-token: write
  contents: read

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name != 'workflow_run' }}
    
    env:
      TARGET_ENV: ${{ github.event.inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Install Dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint -w frontend

      - name: Run Tests
        run: npm test -w frontend

      # Bucket, distribution and API URL come straight from the stack outputs (no copied repo secrets)
      - name: Read stack outputs
        id: stack
        run: |
          output() {
            aws cloudformation describe-stacks --stack-name "parkrun-stack-${TARGET_ENV}"               --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text
          }
          echo "bucket=$(output BucketName)" >> "$GITHUB_OUTPUT"
          echo "distribution_id=$(output DistributionId)" >> "$GITHUB_OUTPUT"
          echo "api_endpoint=$(output ApiEndpoint)" >> "$GITHUB_OUTPUT"

      - name: Build Frontend
        env:
          VITE_API_URL: ${{ steps.stack.outputs.api_endpoint }}
        run: npm run build -w frontend

      - name: Deploy Frontend and invalidate CloudFront
        run: |
          aws s3 sync frontend/dist "s3://${{ steps.stack.outputs.bucket }}" --delete
          aws cloudfront create-invalidation --distribution-id "${{ steps.stack.outputs.distribution_id }}" --paths "/*"
