services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: parkrun
      POSTGRES_PASSWORD: parkrun
      POSTGRES_DB: parkrun
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parkrun"]
      interval: 5s
      timeout: 5s
      retries: 5

  # The API serves JSON files from data/ (it does not use the database)
  api:
    build:
      context: .
      dockerfile: api/Dockerfile.dev
    volumes:
      - ./api:/repo/api
      - ./data:/repo/data
      - /repo/api/node_modules
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - FRONTEND_URL=http://localhost:5173
      - NODE_ENV=development
      - DATA_DIR=/repo/data
      - DEBUG=true

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    volumes:
      - ./frontend:/repo/frontend
      - /repo/frontend/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3001
      - VITE_DEBUG=true
    depends_on:
      - api

volumes:
  postgres_data:
